[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evp"
version = "0.1.0"
description = "Edge vision pipeline: prelabel -> LabelMe review -> train -> verified ncnn deploy bundle"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6",
    "pillow>=9",
    "opencv-python>=4.6",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "onnxslim>=0.1.30",
    "ncnn>=1.0.20240410",
]

[project.optional-dependencies]
ultralytics = ["torch>=2.1", "ultralytics>=8.3"]
webui = ["gradio>=6.14,<7", "gradio_image_annotation>=0.5.6,<0.6"]
dev = ["pytest>=7"]

[project.scripts]
evp = "evp.cli:main"

[tool.setuptools.packages.find]
include = ["evp*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scratch", "models"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, upgrades
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E741",   # `l` for layer in short comprehensions
    "B905",   # zip() without strict= (lengths are validated explicitly where it matters)
    "UP007",  # keep `X | None` / Optional mix as written
    "UP009",  # the utf-8 coding cookie is a project convention (see README)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # raised inside gradio's queue with pandas 3, not by evp code
    "ignore:.*no_silent_downcasting.*",
    "ignore:The copy keyword is deprecated",
]
markers = [
    "integration: needs pretrained weights, torch/ultralytics and the native toolchain (pnnx / ncnn tools)",
    "slow: takes more than ~30 s",
]
